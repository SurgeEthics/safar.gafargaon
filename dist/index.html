    <script>
      // Gracefully suppress Vite HMR WebSocket connection errors and Firestore warnings in sandbox iframe environment
      (function() {
        var origError = console.error;
        console.error = function() {
          var text = '';
          for (var i = 0; i < arguments.length; i++) {
            var arg = arguments[i];
            text += ' ' + (arg && arg.message ? arg.message : String(arg || ''));
          }
          if (
            text.includes('WebSocket') ||
            text.includes('closed without opened') ||
            text.includes('[vite]') ||
            text.includes('failed to connect to websocket')
          ) {
            return;
          }
          return origError.apply(console, arguments);
        };

        var origWarn = console.warn;
        console.warn = function() {
          var text = '';
          for (var i = 0; i < arguments.length; i++) {
            var arg = arguments[i];
            text += ' ' + (arg && arg.message ? arg.message : String(arg || ''));
          }
          if (
            text.includes('WebSocket') ||
            text.includes('closed without opened') ||
            text.includes('Driver trip log Firestore listener error') ||
            text.includes('Firestore places sync fallback')
          ) {
            return;
          }
          return origWarn.apply(console, arguments);
        };

        window.addEventListener('unhandledrejection', function(event) {
          var msg = event?.reason?.message || String(event?.reason || '');
          if (msg.includes('WebSocket') || msg.includes('closed without opened') || msg.includes('vite')) {
            event.preventDefault();
            if (typeof event.stopImmediatePropagation === 'function') event.stopImmediatePropagation();
          }
        }, true);

        window.addEventListener('error', function(event) {
          var msg = event?.message || String(event?.error?.message || '');
          if (msg.includes('WebSocket') || msg.includes('closed without opened') || msg.includes('vite')) {
            event.preventDefault();
            if (typeof event.stopImmediatePropagation === 'function') event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
